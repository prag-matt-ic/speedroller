<div id="speedroller-course-review">
  <style>
    #speedroller-course-review { color: var(--foreground); }
    #speedroller-course-review .cr-heading { padding-right: 96px; }
    #speedroller-course-review .cr-meta { display:flex; flex-wrap:wrap; gap:8px 20px; margin:8px 0 16px; }
    #speedroller-course-review .cr-legend { display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; margin:12px 0; }
    #speedroller-course-review .cr-key { display:inline-flex; gap:7px; align-items:center; }
    #speedroller-course-review .cr-floor-key { width:18px; height:12px; background:var(--muted); border:1px solid var(--border); }
    #speedroller-course-review .cr-ring-key { width:10px; height:10px; border:2px solid var(--orange); border-radius:50%; }
    #speedroller-course-review .cr-hole-key { width:16px; height:11px; border:1px dashed var(--destructive); }
    #speedroller-course-review .cr-decor-key { width:12px; height:12px; background:var(--viz-series-1); opacity:0.3; }
    #speedroller-course-review .cr-line-key { width:20px; height:0; border-top:2px solid var(--viz-series-1); }
    #speedroller-course-review .cr-chart { width:100%; display:block; overflow:visible; }
    #speedroller-course-review .cr-chart text { fill:var(--foreground); font-family:inherit; font-size:12px; font-weight:400; }
    #speedroller-course-review .cr-chart .quiet { fill:var(--muted-foreground); }
    #speedroller-course-review .cr-chart .terrain { fill:var(--muted); stroke:var(--border); stroke-width:0.7; }
    #speedroller-course-review .cr-chart .route-line { fill:none; stroke-width:1.5; }
    #speedroller-course-review .cr-chart .ring { fill:var(--background); stroke:var(--orange); stroke-width:2; }
    #speedroller-course-review .cr-chart .grid { stroke:var(--border); stroke-width:0.5; }
    #speedroller-course-review .cr-chart .boundary { stroke:var(--border); stroke-width:1; stroke-dasharray:3 5; }
    #speedroller-course-review .cr-detail { margin:8px 0 12px; min-height:2.8em; }
    #speedroller-course-review details { margin-top:16px; }
    #speedroller-course-review summary { color:var(--foreground); }
  </style>
  <div class="cr-heading">
    <h2>Course draft C</h2>
    <div class="text-small text-muted">Flat terrain · travel upwards · proposed placements</div>
  </div>
  <div class="cr-meta text-small tabular-nums">
    <span>1,200 units from START to FINISH</span><span>60 rings placed · 35–47 on one route · 6 holes</span>
  </div>
  <div class="viz-controls">
    <label class="form-label">Course section
      <select id="cr-section" class="form-select">
        <option value="all">Whole course</option>
        <option value="lobby">Lobby and start</option>
        <option value="launch">1 · Launch</option>
        <option value="sweeps">2 · Broad sweeps</option>
        <option value="slalom">3 · Branching slalom</option>
        <option value="recovery">4 · Recovery straight</option>
        <option value="finale">5 · Technical finale</option>
        <option value="sprint">6 · Finish sprint</option>
      </select>
    </label>
    <label class="form-label">Highlight racing line
      <select id="cr-route" class="form-select">
        <option value="all">All paths</option>
        <option value="A">A · Wider lines</option>
        <option value="B">B · Technical lines</option>
        <option value="C">C · Outside finale, A elsewhere</option>
      </select>
    </label>
  </div>
  <div class="cr-legend text-small">
    <span class="cr-key"><span class="cr-floor-key"></span>Walkable floor</span>
    <span class="cr-key"><span class="cr-ring-key"></span>Ring</span>
    <span class="cr-key"><span class="cr-hole-key"></span>Hole</span>
    <span class="cr-key"><span class="cr-decor-key"></span>Decoration · non-driveable</span>
    <span class="cr-key"><span class="cr-line-key"></span>Racing line</span>
    <span id="cr-scale" class="text-muted"></span>
  </div>
  <svg id="cr-map" class="cr-chart" role="img" aria-labelledby="cr-map-title cr-map-description"></svg>
  <div id="cr-detail" class="cr-detail text-small" aria-live="polite"></div>
  <details>
    <summary id="cr-ring-summary">Ring coordinates</summary>
    <div class="table-responsive">
      <table class="table table-sm">
        <thead><tr><th>Ring</th><th>Path</th><th class="text-end">Distance</th><th class="text-end">X</th><th>Placement</th></tr></thead>
        <tbody id="cr-ring-table"></tbody>
      </table>
    </div>
  </details>
  <script>
  (() => {
    const root = document.getElementById('speedroller-course-review');
    const svg = root.querySelector('#cr-map');
    const sectionInput = root.querySelector('#cr-section');
    const routeInput = root.querySelector('#cr-route');
    const ns = 'http://www.w3.org/2000/svg';
    const sections = [
      {id:'launch',name:'Launch',short:['1 · Launch'],start:0,end:180,note:'Wide opening; rings teach the line before the first route choice.'},
      {id:'sweeps',name:'Broad sweeps',short:['2 · Broad','sweeps'],start:180,end:380,note:'First split: A offers a 9-tile line with 2 branch rings; B narrows to 7 tiles for 4.'},
      {id:'slalom',name:'Branching slalom',short:['3 · Branching','slalom'],start:380,end:600,note:'A flows through broad bends with 3 branch rings; B changes direction more sharply for 7.'},
      {id:'recovery',name:'Recovery straight',short:['4 · Recovery','straight'],start:600,end:760,note:'Three holes interrupt the straight. The six shared rings guide right → left → right around them.'},
      {id:'finale',name:'Technical finale',short:['5 · Technical','finale'],start:760,end:1020,note:'Three paths: A is 7 tiles wide / 2 branch rings; B is 5 tiles / 6; C is 5 tiles / 4.'},
      {id:'sprint',name:'Finish sprint',short:['6 · Finish','sprint'],start:1020,end:1200,note:'Three holes: one before the split, one on wider path A, and one after the merge. Rings guide around each; the last 21 units stay clear.'}
    ];
    // Points are [forward distance, centre X, width in tiles]. Raster rows retain the 33-column source grid.
    const paths = [
      {id:'lobby',section:'lobby',kind:'shared',points:[[-32,0,17],[-9,0,17],[-8,0,9],[0,0,9]]},
      {id:'launch',section:'launch',kind:'shared',points:[[0,0,9],[20,0,15],[55,0,15],[100,-3,13],[140,2,13],[180,0,13]]},
      {id:'sweep-in',section:'sweeps',kind:'shared',points:[[180,0,13],[215,5,13],[245,2,13]]},
      {id:'sweep-A',section:'sweeps',kind:'A',points:[[245,2,13],[270,-7,9],[305,-10,9],[330,-6,9],[350,0,13]]},
      {id:'sweep-B',section:'sweeps',kind:'B',points:[[245,2,13],[270,8,7],[285,11,7],[307,6,7],[327,9,7],[350,0,13]]},
      {id:'sweep-out',section:'sweeps',kind:'shared',points:[[350,0,13],[380,0,13]]},
      {id:'slalom-in',section:'slalom',kind:'shared',points:[[380,0,13],[410,0,13]]},
      {id:'slalom-A',section:'slalom',kind:'A',points:[[410,0,13],[435,-8,9],[470,-11,9],[520,-7,9],[550,-10,9],[575,0,13]]},
      {id:'slalom-B',section:'slalom',kind:'B',points:[[410,0,13],[435,8,7],[452,11,5],[474,4,5],[497,10,5],[520,4,5],[544,10,5],[560,6,7],[575,0,13]]},
      {id:'slalom-out',section:'slalom',kind:'shared',points:[[575,0,13],[600,0,13]]},
      {id:'recovery',section:'recovery',kind:'shared',points:[[600,0,13],[635,1,15],[680,4,15],[730,0,15],[760,0,13]]},
      {id:'finale-in',section:'finale',kind:'shared',points:[[760,0,13],[800,0,13]]},
      {id:'finale-A',section:'finale',kind:'A',points:[[800,0,13],[830,-10,7],[870,-11,7],[920,-8,7],[960,-10,7],[990,0,13]]},
      {id:'finale-B',section:'finale',kind:'B',points:[[800,0,13],[825,0,5],[842,2,5],[857,-2,5],[872,2,5],[887,-2,5],[902,2,5],[917,-2,5],[932,2,5],[947,-2,5],[962,2,5],[976,0,5],[990,0,13]]},
      {id:'finale-C',section:'finale',kind:'C',points:[[800,0,13],[830,10,5],[855,8,5],[880,11,5],[910,8,5],[940,11,5],[970,8,5],[990,0,13]]},
      {id:'finale-out',section:'finale',kind:'shared',points:[[990,0,13],[1020,0,11]]},
      {id:'sprint-in',section:'sprint',kind:'shared',points:[[1020,0,11],[1045,0,11]]},
      {id:'sprint-A',section:'sprint',kind:'A',points:[[1045,0,11],[1070,-8,9],[1100,-10,9],[1125,-7,9],[1150,0,11]]},
      {id:'sprint-B',section:'sprint',kind:'B',points:[[1045,0,11],[1070,8,7],[1090,11,5],[1110,5,5],[1130,9,5],[1150,0,11]]},
      {id:'sprint-out',section:'sprint',kind:'shared',points:[[1150,0,11],[1185,0,11],[1197,0,9],[1200,0,9]]},
      {id:'runout',section:'sprint',kind:'shared',points:[[1200,0,9],[1214,0,13]]}
    ];
    const byId = Object.fromEntries(paths.map(p => [p.id,p]));
    const holes = [
      {id:'H1',section:'recovery',start:622,end:632,left:-2,right:2},
      {id:'H2',section:'recovery',start:668,end:679,left:3,right:6},
      {id:'H3',section:'recovery',start:720,end:731,left:-3,right:1},
      {id:'H4',section:'sprint',start:1026,end:1036,left:-1,right:1},
      {id:'H5',section:'sprint',start:1086,end:1096,left:-10,right:-9},
      {id:'H6',section:'sprint',start:1168,end:1178,left:-1,right:1}
    ];
    const guidePaths = {
      recovery:{points:[[600,0,1],[612,4,1],[638,4,1],[652,0,1],[690,0,1],[708,4,1],[744,4,1],[760,0,1]]},
      'finale-out':{points:[[990,0,1],[1008,0,1],[1020,3,1]]},
      'sprint-in':{points:[[1020,3,1],[1038,3,1],[1045,0,1]]},
      'sprint-A':{points:[[1045,0,1],[1070,-8,1],[1080,-12,1],[1098,-12,1],[1125,-7,1],[1150,0,1]]},
      'sprint-out':{points:[[1150,0,1],[1160,3,1],[1180,3,1],[1192,0,1],[1200,0,1]]}
    };
    const ringXOverrides={612:4,638:4,664:0,690:0,716:4,744:4,1032:3,1080:-12,1160:3,1176:3};
    const isHole=(x,s)=>holes.some(h=>s>=h.start&&s<=h.end&&x>=h.left&&x<=h.right);
    function sample(path,distance) {
      const points = path.points;
      let segment = points.length - 2;
      for(let i=0;i<points.length-1;i++) if(distance<=points[i+1][0]) {segment=i;break;}
      const a=points[segment], b=points[segment+1];
      const t=Math.max(0,Math.min(1,(distance-a[0])/(b[0]-a[0])));
      const eased=t*t*(3-2*t);
      return {x:a[1]+(b[1]-a[1])*eased,width:a[2]+(b[2]-a[2])*eased};
    }
    function bounds(path,distance) {
      const value=sample(path,distance);
      const half=Math.round((value.width-1)/2);
      return {left:Math.round(value.x)-half-0.5,right:Math.round(value.x)+half+0.5};
    }
    // Scenery stays outside every playable interval, including the floor beside holes.
    function clearOfTrack(x,s) {
      return paths.every(p=>{
        if(s<p.points[0][0]||s>p.points.at(-1)[0]) return true;
        const b=bounds(p,s);
        return x+0.5<=b.left-2 || x-0.5>=b.right+2;
      });
    }
    const decorations=[];
    const decorationKeys=new Set();
    function decoration(x,s,pattern) {
      const key=`${s},${x}`;
      if(x < -16 || x > 16 || decorationKeys.has(key) || !clearOfTrack(x,s)) return;
      decorationKeys.add(key);decorations.push({x,s,pattern});
    }
    for(const [start,end] of [[16,58],[606,628],[734,752],[1152,1164]]) {
      for(let s=start;s<=end;s++) for(const side of [-1,1]) for(let c=12;c<=16;c++) {
        if((c+s)%2===0) decoration(side*c,s,'checker');
      }
    }
    for(const [distance,halfWidth,centre] of [[84,2,14],[108,2,14],[132,2,14],[156,2,14],[650,1,15],[674,1,15],[698,1,15],[722,1,15],[1170,2,14],[1182,2,14],[1194,2,14]]) {
      for(const side of [-1,1]) for(let offset=-halfWidth;offset<=halfWidth;offset++) {
        const x=side*centre+offset;
        const s=distance-2*Math.abs(offset);
        decoration(x,s,'chevron');decoration(x,s-1,'chevron');
      }
    }
    const placements = [
      ['launch',[30,50,75,95,115,135,155,172],'Follow the opening line'],
      ['sweep-in',[190,215,240],'Shared approach'],
      ['sweep-A',[280,315],'Wide bend'],
      ['sweep-B',[276,294,315,334],'Technical bend and exit'],
      ['sweep-out',[365],'Shared merge'],
      ['slalom-in',[390],'Split approach'],
      ['slalom-A',[445,500,550],'Flowing line'],
      ['slalom-B',[438,454,473,495,517,540,558],'Slalom commitment'],
      ['slalom-out',[590],'Shared exit'],
      ['recovery',[612,638,664,690,716,744],'Weave around H1–H3'],
      ['finale-in',[770],'Three-way approach'],
      ['finale-A',[850,920],'Wider finale'],
      ['finale-B',[842,857,887,902,947,962],'Precision sequence'],
      ['finale-C',[840,880,925,970],'Exposed outside line'],
      ['finale-out',[1008],'Shared merge'],
      ['sprint-in',[1032],'Pass H4 on the right'],
      ['sprint-A',[1080,1125],'Pass H5 on the left'],
      ['sprint-B',[1074,1092,1112,1132],'Technical sprint line'],
      ['sprint-out',[1160,1176,1192],'Pass H6 on the right; then finish']
    ];
    const rings=placements.flatMap(([pathId,distances,note])=>distances.map((s,i)=>{
      const path=byId[pathId];
      const offset=path.kind==='B' ? [1,-1,0][i%3] : 0;
      return {pathId,section:path.section,kind:path.kind,s,x:ringXOverrides[s]??Math.round(sample(path,s).x+offset),note};
    })).sort((a,b)=>a.s-b.s || a.x-b.x).map((r,i)=>({...r,id:String(i+1).padStart(2,'0')}));
    const colours={shared:'var(--muted-foreground)',A:'var(--viz-series-1)',B:'var(--viz-series-2)',C:'var(--viz-series-3)'};
    let selection='all', line='all';
    function included(kind,section) {
      if(line==='all'||kind==='shared') return true;
      const chosen=line==='C' ? (section==='finale'?'C':'A') : line;
      return kind===chosen;
    }
    function node(tag,attributes={},text) {
      const el=document.createElementNS(ns,tag);
      for(const [name,value] of Object.entries(attributes)) el.setAttribute(name,String(value));
      if(text!==undefined) el.textContent=text;
      return el;
    }
    function add(tag,attributes,text) {const el=node(tag,attributes,text);svg.appendChild(el);return el;}
    function pathLine(path,start,end,X,Y) {
      const points=[];
      for(let d=start;d<=end;d+=1) points.push(`${points.length?'L':'M'}${X(sample(guidePaths[path.id]??path,d).x).toFixed(2)},${Y(d).toFixed(2)}`);
      return points.join(' ');
    }
    function terrainPolygon(path,start,end,X,Y) {
      const left=[],right=[];
      for(let d=start;d<=end;d++) {
        const b=bounds(path,d);
        left.push([X(b.left),Y(d-0.5)],[X(b.left),Y(d+0.5)]);
        right.push([X(b.right),Y(d-0.5)],[X(b.right),Y(d+0.5)]);
      }
      return left.concat(right.reverse()).map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' ');
    }
    function save() {
      const state={modelContent:{design:'Course draft C',section:selection,highlightedRoute:line,totalPlacedRings:rings.length,holes:holes.length,decoration:'Checker grids and forward chevrons, non-driveable'},privateContent:{selection,line}};
      if(window.openai?.setWidgetState) Promise.resolve(window.openai.setWidgetState(state)).catch(()=>{});
    }
    function restore(state) {
      const data=state?.privateContent;
      if(!data) return;
      if(['all','lobby',...sections.map(s=>s.id)].includes(data.selection)) selection=data.selection;
      if(['all','A','B','C'].includes(data.line)) line=data.line;
    }
    function render() {
      sectionInput.value=selection;routeInput.value=line;
      const width=Math.max(280,root.getBoundingClientRect().width);
      const overview=selection==='all';
      const section=sections.find(s=>s.id===selection);
      const minimum=overview?-36:selection==='lobby'?-36:section.start-8;
      const maximum=overview?1218:selection==='lobby'?25:section.end+(selection==='sprint'?18:8);
      const longLabels=overview && width>=520;
      const left=longLabels?112:48,right=longLabels?100:22;
      const sx=Math.min(overview?9:12,(width-left-right)/33);
      const center=left+(width-left-right)/2;
      const sy=sx;
      const plotHeight=(maximum-minimum)*sy;
      const top=35,bottom=top+plotHeight,height=bottom+48;
      const X=x=>center+x*sx;
      const Y=d=>bottom-(d-minimum)*sy;
      svg.replaceChildren();
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      svg.style.height=`${height}px`;
      add('title',{id:'cr-map-title'},overview?'Proposed Speedroller course, all six sections':selection==='lobby'?'Lobby and start layout':section.name+' paths and rings');
      add('desc',{id:'cr-map-description'},'Top-down flat course. Forward travel is upwards. Floor is rasterised to 33 columns. Outlined circles mark 60 proposed rings. Six outlined holes remove floor in the recovery straight and finish sprint. Faint side tiles form checker grids and forward-facing chevrons; these are non-driveable decoration. Alternative routes are labelled A, B and C. Horizontal and vertical scales are equal, with square grid cells; use the section selector for closer inspection. Exact ring coordinates are available in the table below.');
      const visibleHoles=holes.filter(h=>h.end>=minimum&&h.start<=maximum);
      const defs=add('defs');
      const clip=node('clipPath',{id:'cr-floor-clip'});
      let clipPath=`M0 0H${width}V${height}H0Z`;
      for(const h of visibleHoles) {
        const x=X(h.left-0.5),y=Y(h.end+0.5),w=(h.right-h.left+1)*sx,depth=(h.end-h.start+1)*sy;
        clipPath+=` M${x} ${y}h${w}v${depth}h${-w}Z`;
      }
      clip.appendChild(node('path',{d:clipPath,'clip-rule':'evenodd','fill-rule':'evenodd'}));defs.appendChild(clip);
      for(const x of [-16,0,16]) {
        add('line',{x1:X(x),x2:X(x),y1:top,y2:bottom,class:'grid'});
        add('text',{x:X(x),y:height-12,'text-anchor':'middle',class:'quiet'},x===0?'X 0':String(x));
      }
      const step=overview?200:selection==='lobby'?10:40;
      for(let s=Math.ceil(minimum/step)*step;s<=maximum;s+=step) {
        if(s===0||s===1200) continue;
        add('text',{x:X(-16.5)-9,y:Y(s)+4,'text-anchor':'end',class:'quiet'},s);
      }
      for(const tile of decorations) {
        if(tile.s<minimum||tile.s>maximum) continue;
        add('rect',{x:X(tile.x-0.43),y:Y(tile.s+0.43),width:0.86*sx,height:0.86*sy,fill:'var(--viz-series-1)',opacity:tile.pattern==='checker'?0.2:0.35,'data-tooltip':`${tile.pattern==='checker'?'Checker tile':'Forward chevron'} · decorative only`});
      }
      const visiblePaths=paths.filter(p=>p.points[0][0]<=maximum && p.points.at(-1)[0]>=minimum);
      for(const p of visiblePaths) {
        const a=Math.max(Math.ceil(minimum),p.points[0][0]),b=Math.min(Math.floor(maximum),p.points.at(-1)[0]);
        add('polygon',{points:terrainPolygon(p,a,b,X,Y),class:'terrain',opacity:included(p.kind,p.section)?1:0.35,'clip-path':'url(#cr-floor-clip)'});
      }
      for(const p of visiblePaths) {
        const a=Math.max(Math.ceil(minimum),p.points[0][0]),b=Math.min(Math.floor(maximum),p.points.at(-1)[0]);
        add('path',{d:pathLine(p,a,b,X,Y),class:'route-line',stroke:colours[p.kind],opacity:included(p.kind,p.section)?0.9:0.17,'stroke-dasharray':p.kind==='shared'?'2 5':p.kind==='B'?'5 3':p.kind==='C'?'1 3':'none'});
      }
      for(const h of visibleHoles) {
        const x=X(h.left-0.5),y=Y(h.end+0.5),w=(h.right-h.left+1)*sx,depth=(h.end-h.start+1)*sy;
        add('rect',{x,y,width:w,height:depth,fill:'none',stroke:'var(--destructive)','stroke-width':1.1,'stroke-dasharray':'3 2','data-tooltip':`${h.id} · hole · ${h.start}–${h.end} units · X ${h.left} to ${h.right}`});
        if(!overview&&w>=18&&depth>=18) add('text',{x:x+w/2,y:y+depth/2+4,'text-anchor':'middle'},h.id);
      }
      for(const s of sections) {
        if(s.end<minimum||s.start>maximum) continue;
        if(overview&&s.start>0) add('line',{x1:X(-16.5),x2:X(16.5),y1:Y(s.start),y2:Y(s.start),class:'boundary'});
        if(longLabels) {
          const y=Y((s.start+s.end)/2);
          s.short.forEach((name,i)=>add('text',{x:4,y:y+i*17-((s.short.length-1)*8)},name));
          const count=rings.filter(r=>r.section===s.id&&included(r.kind,r.section)).length;
          add('text',{x:X(16.5)+14,y:y},`${count} rings`);
          add('text',{x:X(16.5)+14,y:y+18,class:'quiet'},`${s.end-s.start} units`);
        }
      }
      // Paint tiles are design markers, with numbers instead of assumed game palette colours.
      if(minimum<0) {
        for(let i=0;i<4;i++) {
          const x=[-4.5,-1.5,1.5,4.5][i];
          add('rect',{x:X(x-1),y:Y(-18+1),width:2*sx,height:2*sy,fill:'var(--viz-series-1)',opacity:0.45});
          if(!overview) add('text',{x:X(x),y:Y(-18)+4,'text-anchor':'middle'},i+1);
        }
        if(!overview) {
          add('text',{x:center,y:Y(-22),'text-anchor':'middle'},'Paint Shop');
          add('text',{x:center,y:Y(-29),'text-anchor':'middle',class:'quiet'},'Lobby · manual movement');
        }
      }
      for(const [distance,label] of [[0,'START'],[1200,'FINISH']]) {
        if(distance<minimum||distance>maximum) continue;
        add('rect',{x:X(-4.5),y:Y(distance+1.5),width:9*sx,height:Math.max(3,3*sy),fill:'var(--foreground)'});
        add('text',{x:X(4.5)+10,y:Y(distance)+4},label);
      }
      const drawnRings=rings.filter(r=>r.s>=minimum&&r.s<=maximum);
      for(const r of drawnRings) {
        const circle=add('circle',{cx:X(r.x),cy:Y(r.s),r:overview?3.4:5,class:'ring',opacity:included(r.kind,r.section)?1:0.16,'data-tooltip':`Ring ${r.id} · ${r.kind==='shared'?'shared':r.kind} · ${r.s} units · X ${r.x} · ${r.note}`});
        circle.setAttribute('aria-label',`Ring ${r.id}, ${r.kind}, distance ${r.s}, X ${r.x}`);
        if(!overview&&width>=520&&included(r.kind,r.section)) add('text',{x:X(r.x)+8,y:Y(r.s)+4},r.id);
      }
      // Label each distinct branch where it is fully separated, using the same letters as the controls.
      for(const [s,ids] of [[300,['sweep-A','sweep-B']],[485,['slalom-A','slalom-B']],[906,['finale-A','finale-B','finale-C']],[1102,['sprint-A','sprint-B']]]) {
        if(s<minimum||s>maximum) continue;
        ids.forEach(id=>{
          const p=byId[id];
          const candidates=[s];
          for(let offset=4;offset<=44;offset+=4) candidates.push(s-offset,s+offset);
          const clearDistance=candidates.find(d=>d>Math.max(minimum,p.points[0][0]+25)&&d<Math.min(maximum,p.points.at(-1)[0]-20)&&drawnRings.every(r=>Math.abs(X(sample(p,d).x)-X(r.x))>15||Math.abs(Y(d)-Y(r.s))>16));
          if(clearDistance===undefined) return;
          const x=X(sample(p,clearDistance).x);
          const y=Y(clearDistance);
          add('rect',{x:x-9,y:y-11,width:18,height:20,rx:3,fill:'var(--background)',opacity:0.94});
          add('text',{x,y:y+4,'text-anchor':'middle',opacity:included(p.kind,p.section)?1:0.4},p.kind);
        });
      }
      add('text',{x:8,y:17,class:'quiet'},overview?'Distance ↑':selection==='lobby'?'Lobby → start ↑':`${section.name} ↑`);
      root.querySelector('#cr-scale').textContent='1:1 grid · square cells';
      const relevant=rings.filter(r=>(overview||r.section===selection)&&included(r.kind,r.section));
      const detail=overview ? (line==='all'?'A: wider lines, 35 rings. B: technical lines, 47 rings. C finale with A elsewhere: 37 rings.':`${line==='C'?'C finale with A elsewhere':line+' at every split'}: ${relevant.length} rings on one complete run.`) : selection==='lobby'?'Free movement and four colour choices; no lobby rings. Start holds the ball for the countdown.':section.note;
      root.querySelector('#cr-detail').textContent=detail;
      root.querySelector('#cr-ring-summary').textContent=`Ring coordinates · ${relevant.length} ${line==='all'?'placed':'highlighted'}`;
      const table=root.querySelector('#cr-ring-table');table.replaceChildren();
      for(const r of relevant) {
        const tr=document.createElement('tr');
        for(const [i,value] of [r.id,r.kind==='shared'?'Shared':r.kind,`${r.s} u`,`${r.x} u`,r.note].entries()) {
          const td=document.createElement('td');td.textContent=value;
          if(i===2||i===3) td.className='text-end tabular-nums';tr.appendChild(td);
        }
        table.appendChild(tr);
      }
    }
    sectionInput.addEventListener('change',()=>{selection=sectionInput.value;render();save();});
    routeInput.addEventListener('change',()=>{line=routeInput.value;render();save();});
    window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);render();});
    restore(window.openai?.widgetState);
    new ResizeObserver(render).observe(root);
    render();
    // Read-only review model supports geometry validation without changing game assets.
    root.courseReview={sections,paths,rings,holes,decorations,guidePaths,isHole,sample,bounds};
  })();
  </script>
</div>
